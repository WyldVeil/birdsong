[project]
name = "birdsong"
version = "1.1.0"
description = "A 24/7 bird sound identifier (BirdNET) with a live web page, for Windows, Linux, macOS and Raspberry Pi"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy>=1.24",
    "ai-edge-litert>=1.2",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
]

[tool.uv]
package = false
